name: Build GUI EXE

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "gui.py"
      - "DiacriticalCharacters.spec"
      - "src/**"
      - ".github/workflows/build-gui-exe.yml"

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build GUI executable
        run: |
          pyinstaller --noconfirm --clean DiacriticalCharacters.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DiacriticalCharacters\DiacriticalCharacters.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force
            throw "Executable did not exit; it is probably stuck on a startup error dialog."
          }
          if ($p.ExitCode -ne 0) {
            throw "Executable exited with code $($p.ExitCode)."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiacriticalCharacters-windows
          path: dist/DiacriticalCharacters/**
          if-no-files-found: error
